org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# The JDK is chosen by download-tools.sh / download-tools.cmd and passed in by
# build.sh / build.cmd: Gradle 8.11 runs on JDK 17-23, AGP 8.7 needs 17+. It is
# deliberately not pinned here - a hardcoded org.gradle.java.home makes the
# repository unbuildable on any machine but the one it was written on.
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
